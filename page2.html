    <style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:Arial;padding:10px}
h2{color:#a47cff;margin:15px 0 10px 5px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
@media(min-width:600px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #333;
  transition:0.2s;
}
.card:active{transform:scale(0.95);border-color:#a47cff}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}
.card p{
  padding:10px;
  text-align:center;
  font-weight:bold;
  font-size:14px;
}
.card span{
  display:block;
  font-size:11px;
  color:#888;
  margin-top:2px;
}
</style>

</head>

 <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f0f;color:#fff;padding:15px}
.wrap{max-width:600px;margin:0 auto}

/* SEARCH BAR ON TOP */
.search-box{position:sticky;top:0;background:#0f0f0f;padding:15px 0 15px;z-index:10}
.search-box input{
  width:100%;padding:14px 18px;border-radius:12px;border:none;
  background:#1e1e1e;color:#fff;font-size:16px;outline:none;
  border:1px solid #333;
}
.search-box input:focus{border-color:#fff}

/* PLAYER */
.player{background:#1a1a1a;padding:12px;border-radius:14px;display:flex;gap:12px;align-items:center;margin-bottom:15px}
.player img{width:70px;height:70px;min-width:70px;object-fit:cover;border-radius:10px}
audio{width:100%;height:30px;margin-top:6px}

/* TRACK LIST */
.list{display:grid;gap:8px}
.track{display:flex;gap:10px;align-items:center;background:#1a1a1a;padding:10px;border-radius:10px;cursor:pointer}
.track:hover{background:#222}
.track.active{background:#fff;color:#000}
.track img{width:48px;height:48px;min-width:48px;object-fit:cover;border-radius:6px}
.track b{font-size:14px}
.track small{opacity:.6;font-size:12px}
.hidden{display:none!important}
#count{font-size:12px;opacity:.5;margin:10px 0}
</style>
