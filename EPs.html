    <style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:Arial;padding:10px}
h2{color:#a47cff;margin:15px 0 10px 5px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
@media(min-width:600px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
.card{
  background:#1a1a1a;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #333;
  transition:0.2s;
}
.card:active{transform:scale(0.95);border-color:#a47cff}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}
.card p{
  padding:10px;
  text-align:center;
  font-weight:bold;
  font-size:14px;
}
.card span{
  display:block;
  font-size:11px;
  color:#888;
  margin-top:2px;
}
</style>
</head>
<body>
